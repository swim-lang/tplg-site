<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TPLG — Mobile Preview</title>
  <style>
    @font-face {
      font-family: "Helvetica Neue Web";
      src: url("fonts/HelveticaNeue-Medium.ttf") format("truetype");
      font-weight: 500;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #f9efe1;
      font-family: "Helvetica Neue Web", "Helvetica Neue", Helvetica, Arial, sans-serif;
      padding: 40px 20px;
    }
    .label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #af2124;
    }
    .phone {
      width: 406px;
      height: 860px;
      max-height: calc(100vh - 140px);
      background: #1b2436;
      border-radius: 56px;
      padding: 8px;
      box-shadow:
        0 0 0 2px #16203044,
        0 30px 60px -20px rgba(33, 52, 83, 0.45),
        0 12px 24px -12px rgba(33, 52, 83, 0.3);
      position: relative;
      flex-shrink: 1;
    }
    .phone__screen {
      width: 100%;
      height: 100%;
      border-radius: 48px;
      overflow: hidden;
      background: #f9efe1;
      position: relative;
    }
    .phone__island { display: none; }
    .phone__screen iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .hint {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #213453;
      opacity: 0.65;
    }
    @media (max-width: 460px) {
      body { padding: 0; gap: 0; }
      .label, .hint, .phone__island { display: none; }
      .phone {
        width: 100%;
        height: 100vh;
        max-height: none;
        border-radius: 0;
        padding: 0;
        box-shadow: none;
      }
      .phone__screen { border-radius: 0; }
    }
  </style>
</head>
<body>
  <span class="label">The Political Law Group — Mobile Preview</span>
  <div class="phone">
    <div class="phone__screen">
      <div class="phone__island"></div>
      <iframe src="./" title="TPLG homepage, mobile layout"></iframe>
    </div>
  </div>
  <span class="hint">Scroll inside the phone · tap Menu to open navigation</span>
</body>
</html>
